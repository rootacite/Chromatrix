[[environment.train_data]]
path = "/home/acite/LLM/Character/Alice/cg"
repeat = 2

[[environment.train_data]]
path = "/home/acite/LLM/Character/Alice/st"
repeat = 1

[model_spec]
base_model_version = "sdxl_base_v1-0"
modelspec_architecture = "stable-diffusion-xl-v1-base/lora"
modelspec_implementation = "https://github.com/Stability-AI/generative-models"
modelspec_sai_model_spec = "1.0.0"

[training]
min_snr_gamma = 5.0
seed = 42
mixed_precision = "bf16"
train_batch_size = 3
gradient_accumulation_steps = 1
learning_rate = 1.0
epoch = 20
save_every_n_epochs = 1
save_every_n_steps = 50
# Render the `[[validation.samples]]` images every time a checkpoint is written. false = save
# checkpoints only, no samples (much cheaper per save point; a checkpoint can be sampled later
# from the Dashboard, one shot per checkpoint). Both this switch and the cadence above can be
# changed for the run in progress from the Dashboard's Training Control card — the values here
# are what a run starts with.
sampling_enabled = false
# Validation-set split. `val_split_percent` keeps that share of the dataset's unique images out of
# training (0 = none, 90 = at most; the count is rounded up and each held-out image also loses its
# folder's `repeat` draws). The trainer scores up to `val_sample_count` of those images with the
# same training loss, averages them and writes `Val/Loss` to TensorBoard, where the Dashboard draws
# it beside `Train/Avg_Loss` on one chart; the first pass is step 1, then one every `val_interval`
# steps. `val_interval = 0` keeps the split but never runs a pass. Ranko Utils → Training edits all
# three. A pass is extra forward-only work, so the interval and the count are the cost knobs: 8
# samples every 5 steps costs about +16 % per step, and putting the interval at 1 multiplies the
# pass cost by five (the measured numbers are in doc/configuration.md).
val_split_percent = 0.0
val_sample_count = 8
val_interval = 5
# Optional separate validation directory. Empty = off, and `val_split_percent` above decides. A
# non-empty path enables it and *overrides* the split: every training image stays in training, and
# both validation passes are drawn from this directory instead (recursively, with the same caption
# and mask rules). `val_sample_count` and `val_interval` still apply. Ranko Utils → Training has
# the switch and the picker.
val_data_dir = "/home/acite/LLM/Character/Ren/val"
# Optional: kohya LoRA .safetensors (or its checkpoint directory) to load before
# training starts. Weights only: step/epoch counting still starts at 0, and this
# run writes into its own timestamped run directory.
resume_lora_path = ""

[network]
network_type = "locon"
network_dim = 48
network_alpha = 24
network_dropout = 0.18
conv_dim = 24
conv_alpha = 12
clip_skip = 1
max_token_length = 225

[bucketing]
enable_bucket = true
bucket_no_upscale = true
# Area anchor: a bucket holds about train_resolution² pixels and keeps the image's own aspect
# ratio, so tall images get tall buckets. min/max only clamp the two sides; leftover mismatch is
# letterboxed (pad gets loss weight 0).
train_resolution = 1024
bucket_reso_steps = 128
min_bucket_reso = 384
max_bucket_reso = 2688

[optimization]
cache_latents = true
cache_latents_to_disk = true
# Recompute activations in backward to save VRAM. Turn off for faster steps
# if the GPU has headroom (UNet is the bigger win; TE is smaller).
gradient_checkpointing_unet = true
gradient_checkpointing_te = true
shuffle_caption = true
keep_tokens = 2
caption_extension = ".txt"
noise_offset = 0.05
flush_memory_every_step = false

[unet_optimizer]
unet_learning_rate = 1.0E-4
unet_weight_decay = 0.01
unet_betas_1 = 0.9
unet_betas_2 = 0.99
unet_warmup_steps = 150
unet_max_grad_norm = 1.0

[te_optimizer]
te_learning_rate = 1.0E-5
te_weight_decay = 0.01
te_betas_1 = 0.9
te_betas_2 = 0.99
te_max_grad_norm = 1.0
# Schedule-Free warmup of the text-encoder optimizer. (The UNet has its own
# `unet_warmup_steps` above; the old `[training].lr_warmup_steps` is still read when this key
# is absent, so an older config keeps its warmup.)
te_warmup_steps = 150

[infrastructure]
max_data_loader_n_workers = 20
persistent_workers = true

